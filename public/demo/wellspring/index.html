<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NSKO Wellspring · Côte d'Ivoire live demo</title>
<meta name="robots" content="noindex"><style>@font-face{font-family:Inter;src:url(/fonts/Inter.woff2) format("woff2");font-weight:100 900}@font-face{font-family:"JetBrains Mono";src:url(/fonts/JetBrainsMono-400.woff2) format("woff2");font-weight:400}@font-face{font-family:"JetBrains Mono";src:url(/fonts/JetBrainsMono-500.woff2) format("woff2");font-weight:500}</style>
<style>
:root{--bg:#F3F6FB;--paper:#fff;--sky:#E6EEFD;--ink:#0A1B33;--ink2:#42536B;--muted:#6B7A90;--blue:#1554E0;--deep:#0D3FB3;--navy:#071A36;--teal:#19B8A6;--alert:#FF5A3C;--amber:#F2A33A;--ice:#7FD4FF;--line:rgba(10,27,51,.09)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--bg);font-family:Inter,system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.mono{font-family:'JetBrains Mono',monospace;letter-spacing:.04em}
.glass{background:rgba(255,255,255,.82);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);border:1px solid rgba(255,255,255,.9);box-shadow:0 20px 50px -20px rgba(7,26,54,.25),0 2px 6px rgba(7,26,54,.06)}
header{position:fixed;top:16px;left:16px;right:16px;height:58px;border-radius:18px;display:flex;align-items:center;gap:18px;padding:0 10px 0 18px;z-index:5}
.brand{display:flex;align-items:center;gap:10px;white-space:nowrap}
.mark{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--blue),var(--navy));display:grid;place-items:center;color:#fff;font-weight:800;font-size:13px;box-shadow:0 6px 16px -6px var(--blue)}
.brand b{font-weight:800;letter-spacing:.18em;font-size:14px}
.brand span{font-size:11px;color:var(--muted)}
.tabs{display:flex;gap:4px;background:var(--sky);padding:4px;border-radius:12px;margin:0 auto}
.tab{border:0;background:transparent;font:600 13px Inter;color:var(--ink2);padding:9px 14px;border-radius:9px;cursor:pointer;display:flex;align-items:center;gap:7px;white-space:nowrap;transition:.2s}
.tab i{width:8px;height:8px;border-radius:50%;background:currentColor;opacity:.5}
.tab.on{background:#fff;color:var(--blue);box-shadow:0 3px 10px -4px rgba(21,84,224,.4)}
.tab.on i{opacity:1}
.hright{display:flex;align-items:center;gap:8px}
.badge{font-size:10px;padding:6px 9px;border-radius:8px;background:rgba(25,184,166,.12);color:#0b7d70;white-space:nowrap}
.lang{border:1px solid var(--line);background:#fff;border-radius:9px;font:600 12px Inter;padding:7px 10px;cursor:pointer;color:var(--ink)}
#panel{position:fixed;top:90px;right:16px;bottom:16px;width:410px;border-radius:22px;overflow:auto;z-index:4;padding:20px;scrollbar-width:thin}
#panel::-webkit-scrollbar{width:6px}#panel::-webkit-scrollbar-thumb{background:rgba(10,27,51,.15);border-radius:3px}
.eyebrow{font-size:10.5px;color:var(--blue);text-transform:uppercase;letter-spacing:.14em;margin-bottom:6px;display:flex;align-items:center;gap:8px}
.eyebrow:before{content:"";width:16px;height:1.5px;background:var(--blue)}
h2{font-size:22px;font-weight:800;letter-spacing:-.02em;line-height:1.15}
h3{font-size:13.5px;font-weight:700;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.sub{font-size:12.5px;color:var(--ink2);margin-top:4px;line-height:1.45}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:15px;margin-top:12px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px}
.kpi b{display:block;font-size:22px;font-weight:800;letter-spacing:-.02em}
.kpi b small{font-size:12px;font-weight:600;color:var(--muted);margin-left:2px}
.kpi span{font-size:10px;color:var(--muted);text-transform:uppercase}
.meter{height:6px;border-radius:3px;background:var(--sky);margin-top:8px;overflow:hidden}
.meter div{height:100%;border-radius:3px;background:linear-gradient(90deg,var(--ice),var(--blue))}
.row{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;padding:7px 0;border-bottom:1px dashed var(--line);gap:10px}
.row:last-child{border:0}
.row span{color:var(--ink2)}.row b{font-weight:700;text-align:right}
.seg{display:flex;background:var(--sky);border-radius:12px;padding:4px;margin-top:14px}
.seg button{flex:1;border:0;background:transparent;padding:9px 6px;border-radius:9px;font:600 12px Inter;color:var(--ink2);cursor:pointer}
.seg button.on{background:#fff;color:var(--blue);box-shadow:0 3px 10px -4px rgba(21,84,224,.35)}
.btn{border:0;background:var(--blue);color:#fff;font:600 12.5px Inter;padding:10px 14px;border-radius:11px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;box-shadow:0 8px 18px -8px var(--blue)}
.btn.ghost{background:#fff;color:var(--blue);border:1px solid rgba(21,84,224,.25);box-shadow:none}
.btn.navy{background:var(--navy);box-shadow:0 8px 18px -8px var(--navy)}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.pill{font-size:10.5px;font-weight:700;padding:4px 9px;border-radius:20px;white-space:nowrap}
.ok{background:rgba(25,184,166,.14);color:#0b7d70}.warn{background:rgba(242,163,58,.16);color:#a5650c}.bad{background:rgba(255,90,60,.13);color:#c93a1e}
.slider{margin-top:12px}
.slider label{display:flex;justify-content:space-between;font-size:12px;color:var(--ink2);margin-bottom:6px}
.slider label b{color:var(--ink)}
input[type=range]{width:100%;accent-color:var(--blue)}
.route{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);align-items:flex-start}
.route:last-child{border:0}
.rank{width:26px;height:26px;border-radius:8px;background:var(--sky);color:var(--blue);display:grid;place-items:center;font:700 12px 'JetBrains Mono';flex:none}
.route.best .rank{background:var(--blue);color:#fff}
.route h4{font-size:13px;font-weight:700}
.route p{font-size:12px;color:var(--ink2);margin-top:3px;line-height:1.45}
.route .meta{display:flex;gap:6px;margin-top:7px;flex-wrap:wrap}
.tag{font-size:10.5px;padding:3px 8px;border-radius:6px;background:var(--bg);color:var(--ink2)}
.link{font:600 12px Inter;color:var(--blue);background:none;border:0;cursor:pointer;margin-top:8px;padding:0}
.feed{background:var(--navy);border-radius:14px;padding:12px;max-height:210px;overflow:auto;display:flex;flex-direction:column;gap:8px}
.msg{font-size:12px;line-height:1.4;padding:8px 11px;border-radius:12px;max-width:85%;color:#fff}
.msg.in{background:rgba(127,212,255,.16);align-self:flex-start;border-bottom-left-radius:4px}
.msg.out{background:var(--blue);align-self:flex-end;border-bottom-right-radius:4px}
.msg small{display:block;opacity:.55;font-size:10px;margin-bottom:2px;font-family:'JetBrains Mono'}
.smsbar{display:flex;gap:6px;margin-top:8px}
.smsbar input{flex:1;border:1px solid var(--line);border-radius:10px;padding:9px 11px;font:500 13px Inter;min-width:0}
.codes{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
.codes button{border:1px solid var(--line);background:#fff;border-radius:7px;font:500 11px 'JetBrains Mono';padding:5px 8px;cursor:pointer;color:var(--ink2)}
.cal{display:grid;grid-template-columns:repeat(12,1fr);gap:3px;margin-top:6px}
.cal div{height:26px;border-radius:5px;background:var(--bg);font:500 9px 'JetBrains Mono';display:grid;place-items:center;color:var(--muted)}
.cal div.r{background:rgba(25,184,166,.22);color:#0b7d70}
.cal div.p{background:var(--teal);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;font-weight:600;padding:7px 11px;border-radius:10px;background:var(--bg)}
.field{display:flex;flex-direction:column;gap:5px;flex:1;min-width:0}
.field span{font-size:10.5px;color:var(--muted);text-transform:uppercase;font-family:'JetBrains Mono'}
.field input{border:1px solid var(--line);border-radius:10px;padding:9px 11px;font:600 14px Inter;width:100%}
.fields{display:flex;gap:8px;margin-top:4px}
.note{font-size:11px;color:var(--muted);margin-top:10px;line-height:1.45}
.site{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.site:hover b{color:var(--blue)}
.dot{width:9px;height:9px;border-radius:50%;flex:none}
.site b{font-size:12.5px;font-weight:700;display:block}
.site span{font-size:11px;color:var(--muted)}
.site .pill{margin-left:auto}
canvas.chart{width:100%;height:170px;display:block;margin-top:6px}
.bars .b{display:flex;align-items:center;gap:8px;font-size:11.5px;margin-top:7px}
.bars .b span{width:96px;color:var(--ink2);flex:none}
.bars .b div{height:8px;border-radius:4px;background:linear-gradient(90deg,#B98552,#6B3F1D)}
.bars .b em{font-style:normal;font-weight:700;margin-left:auto}
#labels{position:fixed;inset:0;pointer-events:none;z-index:2}
.lbl{position:absolute;transform:translate(-50%,-140%);font:600 10.5px Inter;color:var(--navy);background:rgba(255,255,255,.75);padding:3px 7px;border-radius:6px;white-space:nowrap;backdrop-filter:blur(6px)}
.lbl.cap{background:var(--navy);color:#fff}
#legend{position:fixed;left:16px;bottom:16px;border-radius:14px;padding:12px 14px;z-index:3;width:230px}
#legend .t{font-size:11px;font-weight:700;margin-bottom:8px;display:flex;justify-content:space-between}
#legend .g{height:8px;border-radius:4px}
#legend .s{display:flex;justify-content:space-between;font-size:10px;color:var(--muted);margin-top:5px}
#legend .x{font-size:10px;color:var(--muted);margin-top:8px;line-height:1.4}
#hint{position:fixed;top:90px;left:50%;transform:translateX(calc(-50% - 213px));z-index:3;font-size:12.5px;font-weight:600;padding:10px 16px;border-radius:12px;display:flex;align-items:center;gap:8px;transition:opacity .5s}
#hint i{width:8px;height:8px;border-radius:50%;background:var(--alert);box-shadow:0 0 0 0 var(--alert);animation:p 1.6s infinite}
@keyframes p{70%{box-shadow:0 0 0 9px rgba(255,90,60,0)}100%{box-shadow:0 0 0 0 rgba(255,90,60,0)}}
#modal{position:fixed;inset:0;z-index:20;background:rgba(7,26,54,.45);display:none;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(4px)}
#modal.open{display:flex}
.mbox{background:#fff;border-radius:22px;width:min(620px,100%);max-height:92vh;overflow:auto;padding:22px;position:relative;box-shadow:0 40px 90px -30px rgba(7,26,54,.6)}
.close{position:absolute;z-index:3;top:14px;right:14px;width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:#fff;cursor:pointer;font-size:16px}
.guide svg{width:100%;height:auto;background:linear-gradient(180deg,#F7FAFF,#EAF0FA);border-radius:16px;margin-top:14px}
.guide svg .part{transition:.35s;opacity:.28}
.guide svg .part.hl{opacity:1}
.guide svg .part.done{opacity:.75}
.steps{display:flex;gap:6px;margin-top:14px}
.steps button{flex:1;height:6px;border-radius:3px;border:0;background:var(--sky);cursor:pointer}
.steps button.on{background:var(--blue)}
.stepbox{margin-top:14px;min-height:104px}
.stepbox h4{font-size:16px;font-weight:800}
.stepbox p{font-size:13px;color:var(--ink2);margin-top:6px;line-height:1.5}
.parts{margin-top:14px;border-top:1px solid var(--line);padding-top:12px}
.cert{border:2px solid var(--navy);border-radius:16px;padding:20px;position:relative;overflow:hidden}
.cert:after{content:"NSKO";position:absolute;right:-10px;bottom:-30px;font:800 110px Inter;color:rgba(21,84,224,.05);letter-spacing:.1em}
.seal{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;color:#fff;font:800 11px Inter;text-align:center;flex:none}
.receipt{font-family:'JetBrains Mono';font-size:12.5px;background:#FBFCFE;border:1px dashed rgba(10,27,51,.25);border-radius:12px;padding:16px}
.receipt .row{font-family:'JetBrains Mono';font-size:12px}
.qr{display:grid;grid-template-columns:repeat(21,1fr);width:110px;height:110px;gap:0;margin:10px auto 0}
.qr i{background:var(--navy)}.qr i.o{background:transparent}
.foot{font-size:10.5px;color:var(--muted);text-align:center;margin-top:16px;line-height:1.5}
@media (max-width:860px){
 header{top:8px;left:8px;right:8px;height:auto;flex-wrap:wrap;padding:10px 10px 8px 12px;gap:8px;border-radius:16px}
 .tabs{order:3;width:100%;overflow-x:auto;margin:0}
 .tab{padding:8px 10px;font-size:12px;flex:1;justify-content:center}
 .badge{display:none}
 .hright{margin-left:auto}
 #panel{top:auto;left:8px;right:8px;bottom:8px;width:auto;height:50vh;border-radius:20px;padding:16px}
 #legend{display:none}
 #hint{top:auto;bottom:calc(50vh + 18px);transform:translateX(-50%);font-size:12px}
 h2{font-size:19px}
}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="labels"></div>

<header class="glass">
  <div class="brand"><div class="mark">N</div><div><b>NSKO</b><br><span>Wellspring · Côte d'Ivoire</span></div></div>
  <nav class="tabs" id="tabs"></nav>
  <div class="hright"><span class="badge mono" id="badge">DEMO · SIMULATED DATA</span><button class="lang" id="lang">FR</button></div>
</header>

<div id="hint" class="glass"><i></i><span id="hintText">Tap anywhere on Côte d'Ivoire to drop a pin</span></div>
<aside id="panel" class="glass"></aside>
<div id="legend" class="glass"></div>
<div id="modal"><div class="mbox"><button class="close" id="mclose">✕</button><div id="mbody"></div></div></div>

<script src="three.r128.min.js"></script>
<script src="OrbitControls.r128.js"></script>
<script src="app.js"></script>
</body>
</html>
