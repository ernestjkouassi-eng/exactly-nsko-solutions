<!doctype html>
<html><head><meta charset="utf-8"><title>NSKO Solutions · launch film</title>
<style>
@font-face{font-family:Inter;src:url(fonts/Inter.woff2) format('woff2');font-weight:100 900}
@font-face{font-family:JBM;src:url(fonts/JetBrainsMono-500.woff2) format('woff2')}
html,body{margin:0;background:#0A0A0B;overflow:hidden}
#stage{position:relative;width:1920px;height:1080px;overflow:hidden;background:#0A0A0B;font-family:Inter,sans-serif;color:#F5F5F2}
body.v #stage{width:1080px;height:1920px}
#stage .a{position:absolute;left:0;top:0}
canvas.a{pointer-events:none}
#world{position:absolute;inset:0;perspective:2200px;perspective-origin:50% 45%}
.scr{position:absolute;left:0;top:0;transform-style:preserve-3d;border-radius:20px;padding:12px;padding-top:40px;background:linear-gradient(160deg,rgba(255,255,255,.09),rgba(255,255,255,.025));border:1px solid rgba(231,232,234,.2);box-shadow:0 60px 140px rgba(0,0,0,.75),0 0 0 1px rgba(0,0,0,.5) inset;overflow:hidden;will-change:transform}
.scr .bar{position:absolute;left:18px;top:13px;right:18px;height:16px;font:500 13px/16px JBM;letter-spacing:.18em;color:rgba(231,232,234,.62);text-transform:uppercase;white-space:nowrap}
.scr .bar i{display:inline-block;width:8px;height:8px;border-radius:50%;background:rgba(231,232,234,.28);margin-right:7px;vertical-align:1px}
.scr .bar b{font-weight:500;margin-left:16px}
.scr .bar .lv{color:#F5F5F2}.scr .bar .lv:before{content:'';display:inline-block;width:8px;height:8px;border-radius:50%;background:#E5241B;margin-right:8px;vertical-align:1px;box-shadow:0 0 10px #E5241B}
.scr .bar .cc{color:#E8541A}
.scr .view{position:relative;border-radius:10px;overflow:hidden;background:#000}
.scr img{display:block;width:100%;height:100%;object-fit:cover;filter:contrast(1.06) saturate(.92) brightness(.97)}
.scr .sweep{position:absolute;inset:-10% -60%;background:linear-gradient(104deg,transparent 42%,rgba(255,255,255,.0) 44%,rgba(255,255,255,.20) 50%,rgba(255,255,255,0) 56%,transparent 58%);mix-blend-mode:screen;pointer-events:none}
.scr.crop img{transform:scale(1.14);transform-origin:50% 100%}
.scr .glare{position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.07),transparent 30%);pointer-events:none}
.scr.phone{padding:14px;border-radius:58px;background:#0d0e10;border:2px solid #2a2c31}
.scr.phone .view{border-radius:46px}
.scr.phone .island{position:absolute;left:50%;top:26px;width:110px;height:32px;margin-left:-55px;background:#000;border-radius:20px;z-index:3}
.ghost{position:absolute;left:0;top:0;border-radius:18px;overflow:hidden;opacity:.5}
.ghost img{width:100%;height:100%;object-fit:cover;filter:blur(18px) brightness(.55) saturate(.7)}
.hl{position:absolute;font-weight:900;text-transform:uppercase;letter-spacing:-.04em;line-height:.88;white-space:pre;text-shadow:0 10px 40px rgba(0,0,0,.55)}
.hl span{display:block}
.hl em{font-style:normal;color:#E8541A}
.k{position:absolute;font:500 22px/1 JBM;letter-spacing:.3em;text-transform:uppercase;color:#E8541A;white-space:pre}
.sub{position:absolute;font:500 27px/1.38 Inter;color:#B9BDC4;letter-spacing:-.005em}
.lab{position:absolute;font:500 15px/1 JBM;letter-spacing:.24em;text-transform:uppercase;color:rgba(231,232,234,.7);white-space:nowrap}
#rail{position:absolute;left:64px;right:64px;bottom:40px;height:2px;background:rgba(231,232,234,.12)}
#rail i{position:absolute;left:0;top:0;bottom:0;background:#E8541A}
#rail s{position:absolute;top:-4px;width:1px;height:10px;background:rgba(231,232,234,.3)}
#corner{position:absolute;right:64px;top:52px;font:500 15px/1 JBM;letter-spacing:.3em;color:rgba(231,232,234,.55)}
#chap{position:absolute;left:64px;top:52px;font:500 15px/1 JBM;letter-spacing:.3em;color:rgba(231,232,234,.55);white-space:pre}
#vig{position:absolute;inset:0;background:radial-gradient(ellipse 75% 70% at 50% 48%,transparent 55%,rgba(0,0,0,.62) 100%);pointer-events:none}
#flash{position:absolute;inset:0;background:radial-gradient(circle at 50% 50%,rgba(255,240,230,.95),rgba(232,84,26,.35) 35%,transparent 70%);opacity:0;pointer-events:none}
#mark{position:absolute;left:0;top:0}
#mark img{position:absolute;left:0;top:0;width:100%}
</style></head>
<body><div id="stage">

<script>
const Q = new URLSearchParams(location.search), V = Q.get('v') === '1', CUT = Q.get('cut') === '15';

  return k === 'app' ? `${d}/f${String(i + 1).padStart(4, '0')}.jpg` : `${d}/f${String(i).padStart(4, '0')}.jpg`; };

function setSrc(img, src) { if (img.dataset.s !== src) { img.dataset.s = src; img.src = src; pending.push(img.decode().catch(() => {})); } }

function el(tag, cls, parent, html) { const e = document.createElement(tag); if (cls) e.className = cls; if (html !== undefined) e.innerHTML = html; (parent || stage).append(e); return e; }

const MARK = []; const mk = $('mark'); for (let i = 0; i < 25; i++) { const im = el('img', '', mk); im.src = `mark/m${String(i).padStart(2, '0')}.png`; im.style.opacity = 0; MARK.push(im); }
// ---------- scene objects ----------
const SW = L(1180, 940), SH = Math.round(SW * 9 / 16);
const S = {
  hero: screen(SW, SH, '<i></i><i></i><i></i><b>NSKOSOLUTIONS.CO.UK</b>'),
  drone: screen(SW, SH, '<i></i><i></i><i></i><b class="cc">CONCEPT</b><b>FLIGHT SOFTWARE · MACHINE LAB</b>'),
  nova: screen(SW, SH, '<i></i><i></i><i></i><b class="cc">CONCEPT</b><b>NOVA DESK UNIT · PROTOTYPE LAB</b>'),
  medusa: screen(SW, SH, '<i></i><i></i><i></i><b class="cc">CONCEPT</b><b>MEDUSA JF-4 FIELD KIT</b>'),
};
['drone','nova'].forEach(k => S[k].s.classList.add('crop')); S.medusa.img.style.cssText = 'transform:scale(1.42);transform-origin:50% 42.5%';
const G = { hero: ghost(SW, SH), drone: ghost(SW, SH), nova: ghost(SW, SH), medusa: ghost(SW, SH) };
// proof clips
const PW = L(1240, 960), PH = Math.round(PW * (V ? 10 / 16 : 10 / 16));
const P = [
  { o: screen(PW, Math.round(PW * 800 / 1280), '<i></i><i></i><i></i><b class="lv">LIVE</b><b>NSKO · FITNESS, HEALTH AND COACHING · NSKO.CO.UK</b>'), k: 'app', r: 1.15 },
  { o: screen(PW, Math.round(PW * 9 / 16), '<i></i><i></i><i></i><b class="lv">LIVE</b><b>NSKOSOLUTIONS.CO.UK</b>'), k: 'glide', r: 1.2 },
  { o: screen(L(380, 400), Math.round(L(380, 400) * 844 / 390), '', true), k: 'phone', r: 1.15 },
  { o: screen(PW, Math.round(PW * 9 / 16), '<i></i><i></i><i></i><b class="cc">CONCEPT</b><b>PERCEPTION CODE · MACHINE LAB</b>'), k: 'drone', r: 1, off: 1.2 },
  { o: screen(PW, Math.round(PW * 9 / 16), '<i></i><i></i><i></i><b>WHERE WE WORK · FIVE SECTORS</b>'), k: 'sectors', r: 1 },
];
// sector backdrops
const SEC = [['HEALTHCARE.', 'clip/surgery.jpg'], ['PHARMACEUTICAL.', 'rec/sectors/f0040.jpg'], ['AGRICULTURE.', 'clip/drone.jpg'], ['GOVERNMENT\n& DEFENCE.', 'clip/defence.jpg'], ['CORPORATES\n& FOUNDERS.', 'clip/sweeps.jpg']];
const secBg = el('div', '', stage); secBg.className = 'a'; secBg.style.cssText += `;width:${W}px;height:${H}px;overflow:hidden`; stage.insertBefore(secBg, world);
const secImgs = SEC.map(([, s], k) => { const i = el('img', '', secBg); i.src = s; i.style.cssText = `position:absolute;left:0;top:0;width:${W}px;height:${H}px;object-fit:cover;filter:brightness(.42) saturate(.75) contrast(1.05)${k === 1 ? ' blur(7px)' : ''}`; st(i, 0); return i; });
const secShade = el('div', '', secBg); secShade.style.cssText = `position:absolute;inset:0;background:linear-gradient(${V ? '0deg' : '90deg'},rgba(10,10,11,.94) 0%,rgba(10,10,11,.55) 55%,rgba(10,10,11,.2))`;
// ---------- text ----------
const HX = L(110, 72), HB = L(150, 112);
const T = {
  presents: kicker('NSKO SOLUTIONS  PRESENTS', 0, H / 2 - 11, 'c'),
  fail: headline(['SOME SYSTEMS', 'CANNOT <em>FAIL.</em>'], L(190, 132), 0, H / 2 - L(170, 120), 'c'),
  cmr: headline(['COMPLEX MADE REAL.'], L(88, 66), 0, L(H * .72, H * .66), 'c'),
  cmrk: kicker('ENGINEERED IN BRITAIN', 0, L(H * .72 + 118, H * .66 + 100), 'c'),

const CAP = [ // [key, kicker, headline lines, sub, t0, t1]
  ['hero', '01 / WHO WE ARE', ['WE BUILD', 'THE <em>BRAIN.</em>'], 'Intelligent systems, from the brain inside the machine to the platform that runs it.', 11.4, 16.8],
  ['drone', '02 / MACHINE INTELLIGENCE', ['IT LEARNS', 'TO <em>SEE.</em>'], 'Perception, sensor fusion, route planning and control code for autonomous machines.', 16.8, 22.8],
  ['nova', '03 / PROTOTYPE LAB', ['ROBOTS', 'WE BUILD', '<em>OURSELVES.</em>'], '3D-printed shells, off-the-shelf motors and boards, and an NSKO brain inside.', 22.8, 28.2],
  ['medusa', '04 / NSKO SECURE', ['FIND WHAT', 'SHOULD NOT', 'BE <em>THERE.</em>'], 'Cyber security, secure systems and TSCM bug sweeps.', 28.2, 33.6],

  const left = i % 2 === 0; // text side alternates; screen opposite
  const tx = V ? HX : (left ? HX : 1920 - HX - 700), ty = V ? 1080 : 300;
  return { k, a, b, left, kk: kicker(kk, tx, ty), hl: headline(hl, L(108, 104), tx, ty + 52), sb: sub(sb, tx, ty + 52 + L(108, 104) * .9 * hl.length + 34, V ? 900 : 640) };
});
const SECT = SEC.map(([h], i) => ({ kk: kicker(`WHERE WE WORK  ·  0${i + 1} / 05`, HX, L(H / 2 - 150, H - 760)), hl: headline(h.split('\n'), L(176, 92), HX, L(H / 2 - 92, H - 700)), cc: label('CONCEPT IMAGERY', HX, L(H / 2 + (h.includes('\n') ? 250 : 100), H - 700 + (h.includes('\n') ? 270 : 150))) }));
const PROOF = { kk: kicker('05 / THE WORK', HX, L(120, 150)), hl: headline(['PROOF, NOT', '<em>PROMISES.</em>'], L(72, 84), HX, L(162, 196)) };
const CTA = { kk: kicker('06 / START A PROJECT', 0, H / 2 - L(220, 260), 'c'), hl: headline(['BRING US THE', 'HARD <em>PROBLEM.</em>'], L(176, 118), 0, H / 2 - L(160, 200), 'c'), url: label('NSKOSOLUTIONS.CO.UK', 0, H / 2 + L(200, 120), 'c') };
const END = { hl: headline(['COMPLEX MADE REAL.'], L(70, 62), 0, L(640, 1080), 'c'), url: kicker('Bring us the hard problem.  ·  nskosolutions.co.uk', 0, L(752, 1196), 'c'), by: label('BUILT BY NSKO.', 0, L(820, 1262), 'c'), note: label('CONCEPT SCENES ARE ILLUSTRATIVE', 0, L(H - 110, H - 150), 'c') };
END.url.style.textTransform = 'none'; END.url.style.letterSpacing = '.12em'; END.url.style.fontSize = L(24, 26) + 'px';
END.by.style.color = '#8A8F98'; END.note.style.fontSize = '12px'; END.note.style.color = 'rgba(138,143,152,.7)';
// rail ticks
const CH = [[0, ''], [11.4, '01 / WHO WE ARE'], [16.8, '02 / MACHINE INTELLIGENCE'], [22.8, '03 / PROTOTYPE LAB'], [28.2, '04 / NSKO SECURE'], [33.6, 'WHERE WE WORK'], [40.8, '05 / THE WORK'], [50.4, '06 / START A PROJECT'], [55.2, '']];
if (!CUT) CH.slice(1, -1).forEach(([t]) => { const s = el('s', '', $('rail')); s.style.left = (t / 60 * 100) + '%'; });

function screenScene(t, c, i) {
